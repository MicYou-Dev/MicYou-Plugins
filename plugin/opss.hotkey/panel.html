// ── postMessage bridge (see MicYou usePluginPanelBridge) ─────────────
function call(api, args) {
  return new Promise((resolve, reject) => {
    const id = Math.random().toString(36).slice(2);
    const onMsg = (e) => {
      if (e.data && e.data.__micyou === 1 && e.data.id === id) {
        window.removeEventListener('message', onMsg);
        e.data.ok ? resolve(e.data.value) : reject(new Error(e.data.error));
      }
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ __micyou: 1, id, api, args: args || {} }, '*');
  });
}

// ── hotkey capture (sticky preview; adapted from Voice-Typing) ──
let captureSlot = null;          // which binding row is capturing
const held = new Set();          // e.code values currently held
let stickyMouseMain = null;      // 'mouse4' | 'mouse5'
let pending = null;              // { mods: [tok], main: tok|null }

const MOD_ORDER = [
  ['ControlLeft', 'lctrl'], ['ControlRight', 'rctrl'],
  ['AltLeft', 'lalt'], ['AltRight', 'ralt'],
  ['ShiftLeft', 'lshift'], ['ShiftRight', 'rshift'],
  ['MetaLeft', 'lwin'], ['MetaRight', 'rwin'],
];

function mainToken(code) {
  if (/^Key[A-Z]$/.test(code)) return code.slice(3).toLowerCase();
  if (/^Digit[0-9]$/.test(code)) return code.slice(5);
  if (/^F([1-9]|1[0-9]|2[0-4])$/.test(code)) return code.toLowerCase();
  const map = {
    Space: 'space', Enter: 'enter', NumpadEnter: 'enter', Tab: 'tab',
    Backspace: 'backspace', Delete: 'delete', Insert: 'insert',
    Home: 'home', End: 'end', PageUp: 'pageup', PageDown: 'pagedown',
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    Minus: 'minus', Equal: 'equal', BracketLeft: 'bracketleft', BracketRight: 'bracketright',
    Backslash: 'backslash', Semicolon: 'semicolon', Quote: 'quote',
    Comma: 'comma', Period: 'period', Slash: 'slash', Backquote: 'backquote',
    Pause: 'pause',
  };
  return map[code] || null;
}
function isModCode(code) { return MOD_ORDER.some(([c]) => c === code); }
function heldMods() { return MOD_ORDER.filter(([c]) => held.has(c)).map(([, tok]) => tok); }
function heldKeyMain() {
  for (const code of held) {
    if (!isModCode(code)) {
      const tok = mainToken(code);
      if (tok) return tok;
    }
  }
  return null;
}
function comboString(p) { return [...p.mods, ...(p.main ? [p.main] : [])].join('+'); }
function validate(p) {
  if (!p) return t.errEmpty;
  if (p.mods.length === 0 && !p.main) return t.errEmpty;
  if (p.main) {
    const bareOk = /^f([1-9]|1[0-9]|2[0-4])$/.test(p.main) || p.main === 'mouse4' || p.main === 'mouse5';
    if (p.mods.length === 0 && !bareOk) return t.errBareMain;
  } else if (p.mods.length < 2) {
    return t.errSingleMod;
  }
  return null;
}
function snapshot() {
  pending = { mods: heldMods(), main: heldKeyMain() || stickyMouseMain };
  updatePreview();
}
function rowEl(slot, cls) { return document.querySelector(`#bind-${slot} ${cls}`); }
function updatePreview() {
  if (!captureSlot) return;
  const view = rowEl(captureSlot, '.combo');
  const errBox = rowEl(captureSlot, '.errbox');
  const useBtn = rowEl(captureSlot, '.use');
  const str = pending ? comboString(pending) : '';
  view.textContent = str || '…';
  view.classList.add('live');
  const err = pending ? validate(pending) : null;
  errBox.style.display = err ? 'block' : 'none';
  if (err) errBox.textContent = err;
  useBtn.style.display = '';
  useBtn.disabled = !pending || !!validate(pending);
}
function onCaptureDown(e) {
  e.preventDefault(); e.stopPropagation();
  if (e.code === 'Escape') { exitCaptureMode(); return; }
  held.add(e.code);
  if (!isModCode(e.code) && mainToken(e.code)) stickyMouseMain = null;
  snapshot();
}
function onCaptureUp(e) {
  e.preventDefault(); e.stopPropagation();
  held.delete(e.code);
  // Sticky preview: candidate survives key-up so the user can click "Use".
}
function onCaptureMouse(e) {
  if (e.button !== 3 && e.button !== 4) return; // keep normal clicks usable
  e.preventDefault(); e.stopPropagation();
  stickyMouseMain = e.button === 3 ? 'mouse4' : 'mouse5';
  for (const c of Array.from(held)) {
    if (!isModCode(c)) held.delete(c);
  }
  snapshot();
}
function onCaptureBlur() { held.clear(); }
function enterCaptureMode(slot) {
  if (captureSlot && captureSlot !== slot) exitCaptureMode(false);
  captureSlot = slot;
  held.clear(); stickyMouseMain = null; pending = null;
  const capBtn = rowEl(slot, '.capture');
  capBtn.textContent = t.cancel;
  capBtn.classList.add('capturing');
  rowEl(slot, '.bhint').textContent = t.capturingHint;
  updatePreview();
  window.addEventListener('keydown', onCaptureDown, true);
  window.addEventListener('keyup', onCaptureUp, true);
  window.addEventListener('mousedown', onCaptureMouse, true);
  window.addEventListener('blur', onCaptureBlur);
}
function exitCaptureMode(rerender = true) {
  if (!captureSlot) return;
  const slot = captureSlot;
  captureSlot = null;
  held.clear(); stickyMouseMain = null; pending = null;
  window.removeEventListener('keydown', onCaptureDown, true);
  window.removeEventListener('keyup', onCaptureUp, true);
  window.removeEventListener('mousedown', onCaptureMouse, true);
  window.removeEventListener('blur', onCaptureBlur);
  if (rerender) render();
}
async function commitHotkey() {
  const slot = captureSlot;
  if (!slot) return;
  const err = validate(pending);
  if (err) return;
  const def = SLOTS.find((s) => s.slot === slot);
  const str = comboString(pending);
  exitCaptureMode(false);
  try {
    await call('set_config', { key: def.key, value: str });
    // config:changed is broadcast by the host on set_plugin_config; the
    // explicit trigger is a belt-and-braces fallback.
    await call('trigger', { action: 'apply' });
  } catch (e) { console.warn(e); }
  await refresh();
}
async function clearBinding(slot) {
  const def = SLOTS.find((s) => s.slot === slot);
  try {
    await call('set_config', { key: def.key, value: '' });
    await call('trigger', { action: 'apply' });
  } catch (e) { console.warn(e); }
  await refresh();
}
async function testBinding(slot) {
  try {
    await call('trigger', { action: 'test', payload: JSON.stringify({ slot }) });
    await refresh();
  } catch (e) { console.warn(e); }
}

// ── rendering ──
function buildBindings() {
  const host = $('bindings');
  host.innerHTML = '';
  for (const { slot } of SLOTS) {
    const div = document.createElement('div');
    div.className = 'binding';
    div.id = `bind-${slot}`;
    div.innerHTML = `
      <div class="bhead">
        <span class="bname"></span>
        <span class="combo empty">–</span>
        <span class="bhint"></span>
      </div>
      <div class="bactions">
        <button class="capture"></button>
        <button class="primary use" style="display:none"></button>
        <button class="clear"></button>
        <button class="test"></button>
      </div>
      <div class="errbox"></div>
      <div class="warnbox rowwarn"></div>`;
    div.querySelector('.capture').addEventListener('click', () => {
      captureSlot === slot ? exitCaptureMode() : enterCaptureMode(slot);
    });
    div.querySelector('.use').addEventListener('click', commitHotkey);
    div.querySelector('.clear').addEventListener('click', () => clearBinding(slot));
    div.querySelector('.test').addEventListener('click', () => testBinding(slot));
    host.appendChild(div);
  }
}

function renderStatic() {
  $('title').textContent = t.title;
  $('subTitle').textContent = t.sub;
  $('lblEnabled').textContent = t.enabled;
  $('lblMuted').textContent = t.muted;
  $('lblMon').textContent = t.monitoring;
  $('lblPttActive').textContent = t.pttActive;
  $('lblPtmActive').textContent = t.ptmActive;
  $('hBindings').textContent = t.hBindings;
  $('hOptions').textContent = t.hOptions;
  $('lblNotify').textContent = t.notify;
  $('sumNotes').textContent = t.sumNotes;
  $('sumSyntax').textContent = t.sumSyntax;
  $('repoLabel').textContent = t.repo;
  $('notesBody').innerHTML = '<ul>' + t.notes.map((n) => `<li>${n}</li>`).join('') + '</ul>';
  $('syntaxBody').innerHTML = '<ul>' + t.syntax.map((n) => `<li>${n}</li>`).join('') + '</ul>';
  for (const { slot } of SLOTS) {
    const el = document.querySelector(`#bind-${slot}`);
    el.querySelector('.bname').textContent = t.names[slot];
    el.querySelector('.capture').textContent = t.capture;
    el.querySelector('.use').textContent = t.use;
    el.querySelector('.clear').textContent = t.clear;
    el.querySelector('.test').textContent = t.test;
  }
}

function engineLabel(e) { return t.engines[e] || e; }

function render() {
  const st = status || {};
  // engine badge
  const badge = $('engineBadge');
  const engine = st.engine || 'starting';
  badge.textContent = engineLabel(engine);
  badge.className = 'badge ' + (
    engine === 'unavailable' || engine === 'stopped' ? 'err'
      : engine === 'disabled' ? ''
        : engine === 'starting' ? '' : 'ok');
  $('engineDetail').textContent = st.detail || '';
  // fallback badge
  const fb = $('fallbackBadge');
  fb.style.display = st.fallbackActive ? '' : 'none';
  fb.textContent = t.fallbackBadge;
  fb.className = 'badge err';
  // master switch (don't fight the user mid-click)
  if (document.activeElement !== $('chkEnabled')) $('chkEnabled').checked = st.enabled !== false;
  if (document.activeElement !== $('chkNotify')) $('chkNotify').checked = !!cfg.notifyChanges;
  // live state chips
  $('vMuted').textContent = st.muted ? t.on : t.off;
  $('dotMuted').className = 'dot' + (st.muted ? ' on' : '');
  $('vMon').textContent = st.monitoring ? t.on : t.off;
  $('dotMon').className = 'dot' + (st.monitoring ? ' live' : '');
  $('chipPtt').style.display = st.pttActive ? '' : 'none';
  $('chipPtm').style.display = st.ptmActive ? '' : 'none';
  // global warnings
  const gw = $('globalWarn');
  const isLinux = (st.detail || '').includes('/dev/input') || engine === 'linux-evdev';
  gw.style.display = engine === 'linux-evdev' ? 'block' : 'none';
  gw.textContent = t.warnSwallow;
  // bindings
  for (const { slot } of SLOTS) {
    const el = document.querySelector(`#bind-${slot}`);
    const b = (st.bindings && st.bindings[slot]) || {};
    const view = el.querySelector('.combo');
    if (captureSlot !== slot) {
      const text = b.effective || b.raw || '';
      view.textContent = text || t.unbound;
      view.className = 'combo' + (text ? '' : ' empty');
      el.querySelector('.bhint').textContent = t.hints[slot];
      const errBox = el.querySelector('.errbox');
      const err = b.error || '';
      errBox.style.display = err ? 'block' : 'none';
      errBox.textContent = err;
      el.querySelector('.use').style.display = 'none';
      el.querySelector('.capture').textContent = t.capture;
      el.querySelector('.capture').classList.remove('capturing');
    }
    // hold bindings need release events from a native backend
    const warn = el.querySelector('.rowwarn');
    const holdBroken = (slot === 'ptt' || slot === 'ptm') && (b.effective || b.raw) && st.holdSupported === false;
    warn.style.display = holdBroken ? 'block' : 'none';
    warn.textContent = t.warnHold;
    el.querySelector('.test').disabled = !(b.effective || b.raw);
  }
  $('vVersion').textContent = 'v' + (st.version || cfg.version || '?');
}

async function refresh() {
  try {
    cfg = await call('get_config', {});
    if (cfg && cfg.status && typeof cfg.status === 'object') status = cfg.status;
    else if (typeof cfg.status === 'string' && cfg.status) {
      try { status = JSON.parse(cfg.status); } catch { /* keep last */ }
    }
  } catch (e) { /* panel may open before bridge is ready */ }
  render();
}

async function init() {
  try {
    locale = (await call('locale', {})) || 'zh';
  } catch { locale = 'zh'; }
  t = String(locale).toLowerCase().startsWith('en') ? STR.en : STR.zh;
  document.documentElement.lang = t === STR.en ? 'en' : 'zh';
  buildBindings();
  renderStatic();
  await refresh();
  // Poll the status mirror while the panel is open.
  let busy = false;
  setInterval(async () => {
    if (busy || captureSlot) return;
    busy = true;
    await refresh();
    busy = false;
  }, 700);
}

$('chkEnabled').addEventListener('change', async (e) => {
  try { await call('set_config', { key: 'enabled', value: e.target.checked }); } catch (err) { console.warn(err); }
  await refresh();
});
$('chkNotify').addEventListener('change', async (e) => {
  try { await call('set_config', { key: 'notifyChanges', value: e.target.checked }); } catch (err) { console.warn(err); }
});

init();
</script>
</body>
</html>
