[package]
name = "dsp_diagnose"
version = "1.0.2"
edition = "2021"
license = "Unlicense"
description = "MicYou DSP recording diagnostic plugin"
repository = "https://github.com/OrientCOMPASS/DSP-Diagnose"
homepage = "https://github.com/OrientCOMPASS/DSP-Diagnose"
readme = "README.md"

[lib]
name = "dsp_diagnose"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
